kind: circle
name: live-apply-announce
owner: otto
level: spoke
status: live
schema_version: 1
trigger: a prompt is submitted (UserPromptSubmit event)
inputs:
  - session_id
  - pending_announcement_file
outputs:
  - additional_context
invariants:
  - >-
    delivered exactly once per pending announcement -- read-and-clear, never
    re-delivered on a later prompt
  - silent (no output) when there is no pending announcement for this session
failure_routing: lug:live-apply-announce-failure
counter_metric: announcement_delivery_rate
enforcement: hook
depends_on:
  - external:applyCut (writes the pending announcement)
consumers:
  - >-
    external:the announced session's own next turn (reads the injected
    additionalContext)
runs_on: hook_event
hook_event_name: UserPromptSubmit
hook_matcher: ''
hook_script: src/hooks/liveApplyAnnounceHook.js
conformance: conformance/fixtures/session-liveness/session-liveness.conformance.test.js
concern: live-apply-delivery
instructions_ref: reference/circles/live-apply-announce.md
duplicate_of: live-apply-announce
