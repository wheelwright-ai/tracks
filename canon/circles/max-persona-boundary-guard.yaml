kind: circle
name: max-persona-boundary-guard
owner: ozi
level: spoke
status: live
schema_version: 1
trigger: >-
  a Write, Edit or NotebookEdit call is about to run from the top-level
  (non-dispatched) session
inputs:
  - top_level_tool_call_target_path
  - session_dispatch_context
outputs:
  - deny_decision
  - orchestration_scaffold_allowed_row
  - framework_warn_posture_row
invariants:
  - >-
    fires only when NOT dispatched -- the inverse of
    agent-tool-scope-guard/agent-target-scope-guard's own exemption
  - >-
    "dispatched" = agent_id on the hook stdin, or a live dispatch-scope grant
    whose root contains this session's cwd -- no new detection mechanism
  - >-
    declarative content never blocked: lugs/, canon/, docs/, registry/,
    runtime/, ledger/
  - >-
    review/merge never blocked structurally -- matcher excludes Bash (git
    merge/commit/cherry-pick/checkout --ours/--theirs unreachable)
  - >-
    hand-reconciling a merge conflict in application code is original
    authorship, refused; taking one side wholesale is a derivation, allowed
  - >-
    application code = real extension, or a spoke's own code directory,
    generalized across spokes -- never one spoke's hardcoded layout
  - >-
    refusal names the real path, why it's code, why top-level, and the real
    dispatch call to make instead -- never a bare denial
  - >-
    a refusal is a permanent ledger row, never cleared by a later
    self-justification
  - >-
    posture is profile-configurable (deny | warn); warn still writes the row --
    a relaxation is disclosed, never silent
  - >-
    260913 ruling (operator, session 2776bea2): a target outside every repo, not
    deployed provider config, is orchestration scaffold -- allowed, disclosed by
    an ALLOWED ledger row
  - >-
    260913 ruling: the framework's own self-hosting checkout defaults to warn; a
    scaffolded spoke stays deny; explicit canon posture always wins
  - >-
    a target inside ANOTHER registered repo's checkout is refused regardless of
    posture, names the two sanctioned paths (communication lug, or queueDispatch
    externalTargets), lands rows on both ledgers
  - >-
    matcher stays Edit|Write|NotebookEdit; a top-level Bash write to source is
    refused by bash-lug-guard's own sibling check instead
failure_routing: lug:max-persona-boundary-enforced-mechanically-not-by-memory
counter_metric: top_level_application_code_authorship_refusal_rate
enforcement: hook
depends_on: []
consumers:
  - >-
    external:operator (an orchestrating session that authors application code
    itself produces work with no lug, no dispatch record, no fixture and no
    reviewer but its own author -- the real risk this closes, hit twice live on
    260907)
runs_on: hook_event
hook_event_name: PreToolUse
hook_matcher: Edit|Write|NotebookEdit
hook_script: src/hooks/maxPersonaBoundaryGuardHook.js
conformance: >-
  conformance/fixtures/circle-max-persona-boundary-guard/max-persona-boundary-guard.conformance.test.js
concern: top-level-authorship-boundary
instructions_ref: reference/circles/max-persona-boundary-guard.md
duplicate_of: max-persona-boundary-guard
