kind: circle
name: spoke-gauge
owner: ozi
level: spoke
status: live
schema_version: 1
trigger: >-
  a spoke's gauge is composed or shown -- buildSpokeGauge
  (src/conductor/spokeGauge.js) printed first by `node scripts/spoke-status.js`,
  as the first line of the SessionStart goals review in every spoke
  (buildGoalsReviewWakeupParts, src/conductor/goalsReview.js), and one row per
  registered spoke by `node scripts/fleet-gauge.js` on the hub; and every Ozi
  run's close (recordOutcome, src/otto/advisorAutopilot.js) rewrites
  runtime/spoke-gauge.json, which Ozi's next brief and the session-start line
  read first
inputs:
  - pace_reading
  - spoke_status
  - lug_transition_event_log
  - ready_work_drive_log
outputs:
  - gauge_line
  - spoke_gauge_snapshot
  - fleet_gauge_rows
invariants:
  - >-
    one gauge line, four parts in order: GAS (account five-hour and seven-day
    left_pct against the share of the window still ahead -> on pace / burning
    hot / gas left unused, plus the work tank: build-ready hours by estimate and
    the needs-prep count), SPEED (lugs reached done per day over the last 7 days
    and the 7 before with a trend, and dispatches landed vs dispatched),
    POSITION (RIGHT PLACE only when ROLLING with work in the tank and gas not
    unused or hot; otherwise the first gap named), IMPROVE (the single top
    unstick action from spoke-status, with who acts)
  - >-
    no second implementation: the pace is readPaceReading, the tank, verdict,
    holds and unstick actions are buildSpokeStatus's own, the dispatch rows are
    read through spoke-status's readJsonl
  - >-
    numbers are measured or print `unmeasured`, never estimated: an absent pace
    reading, event log or drive log reads unmeasured on that part only
  - >-
    reading is read-only: spoke-status.js and fleet-gauge.js write nothing; the
    one writer is writeSpokeGauge, called at an Ozi run's close, and it never
    fails the outcome row
  - >-
    the session-start line reads the snapshot first and prints its age once it
    is older than one cadence (GAUGE_CADENCE_MS); with no snapshot it reads live
  - >-
    an instance with nothing to review stays silent at session start, the gauge
    included
failure_routing: lug:every-spoke-shows-its-gas-speed-and-position-at-a-glance
counter_metric: spokes_whose_position_was_asked_for_by_hand
enforcement: kernel_check
depends_on:
  - buildSpokeStatus
  - readPaceReading
consumers:
  - external:operator
  - external:ozi (the brief's GAUGE line)
interface_version: v1
runs_on: on_demand
conformance: conformance/fixtures/spoke-gauge/spoke-gauge.conformance.test.js
concern: spoke-health-at-a-glance
instructions_ref: reference/circles/spoke-gauge.md
duplicate_of: spoke-gauge
