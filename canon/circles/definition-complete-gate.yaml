kind: circle
name: definition-complete-gate
owner: ozi
level: spoke
status: live
schema_version: 1
trigger: a lug's state field is edited to defined (or beyond)
inputs:
  - lug
outputs:
  - definition_complete_result
  - ledger_row
invariants:
  - runs deterministically, no network calls
  - never mutates the lug it checks
  - >-
    checks structural completeness only -- not the fresh-context stranger test
    (see ready-gate-stub)
failure_routing: lug:definition-complete-gate-failure
counter_metric: definition_complete_pass_rate
enforcement: hook
depends_on: []
consumers:
  - external:conductor
  - external:proofer
runs_on: hook_event
hook_event_name: PreToolUse
hook_matcher: Edit|Write
hook_script: src/hooks/definitionCompleteGateHook.js
conformance: >-
  conformance/fixtures/circle-definition-complete-gate/definition-complete-gate.conformance.test.js
concern: lug-definition-completeness
instructions_ref: reference/circles/definition-complete-gate.md
duplicate_of: definition-complete-gate
