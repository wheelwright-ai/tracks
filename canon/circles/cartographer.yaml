    a circle/policy/advisor with no resolvable implementing file is reported as
    unfound, never silently dropped
failure_routing: lug:cartographer-failure
counter_metric: map_completeness_ratio
enforcement: kernel_check
depends_on: []
consumers:
  - external:session-continuity-checkpoint
  - external:warmup-goals-review
  - external:proofer
  - external:ready-gate-stub
runs_on: schedule
requires_wheel_clock_job: regenerateCartographerMap
conformance: conformance/fixtures/cartographer/cartographer.conformance.test.js
concern: spoke-understanding
instructions_ref: reference/circles/cartographer.md
interface_version: v1
duplicate_of: cartographer
