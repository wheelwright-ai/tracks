kind: circle
name: cartographer
owner: ozi
level: spoke
status: live
schema_version: 1
trigger: the wheel-scheduler's cartographer_map job, on its declared cadence
inputs:
  - reference_circles
  - compiler_rules
  - canon_advisors
  - conformance_tests
outputs:
  - cartographer_map_artifact
  - wakeup_index
  - location_index
invariants:
