kind: circle
name: secrets-template-migration
owner: basher
level: spoke
status: live
schema_version: 1
trigger: >-
  a spoke's .env.template meets the secrets manifest -- `wcl <spoke>` step 5 on
  a spoke with a template and no canon/secrets.manifest.yaml
  (runSecretsMigrationStep, src/basher/wclCli.js); `node scripts/secrets.js
  migrate|fallbacks|retirement|show [<spoke>]` on demand; getSecret's cache miss
  (src/basher/secrets.js, the dual-read); and every applyCut
  (src/factory/cutUpdate.js), where the measured retirement runs
inputs:
  - env_template
  - secrets_manifest
  - fallback_ledger_rows
outputs:
  - secrets_manifest
  - manifest_proposal
  - resolved_cache
  - fallback_ledger_row
  - retired_template
invariants:
  - >-
    THE TEMPLATE IS THE MANIFEST'S INPUT, NEVER DISCARDED: migrate derives
    canon/secrets.manifest.yaml from .env.template (#@secret + #@optional lines;
    a #@seed-from annotation or an op:// value verbatim as vault/item/field; a
    key with neither gets item=<spoke>, field=<KEY>, needs_op_item: true); the
    template is byte-identical after, asserted by sha256
  - >-
    A MANIFEST THAT EXISTS IS NEVER OVERWRITTEN: a changed template yields
    canon/secrets.manifest.yaml.v2-proposed (the regenerate-docs proposal
    discipline); an unchanged template (same sha256) yields nothing --
    idempotent, zero-cost
  - >-
    DUAL-READ FOR THE MIGRATION CYCLE: getSecret reads the resolved cache first
    and falls back to the template's own op:// reference through the one
    existing resolver (onePassword.js), writing exactly ONE ledger decision row
    per fallback, attribution secrets-template-fallback, naming the key and the
    path -- never a value
  - >-
    RETIREMENT IS PER SPOKE AND MEASURED, NEVER GLOBAL: only when the manifest's
    own migrated_at is max_age x 7 in the past AND zero fallback rows landed
    inside that window does applyCut rename .env.template to
    .env.template.migrated-<cut> and record its sha256 in migrated_from. Never
    deleted. An unobserved window is not a zero
  - >-
    1PASSWORD STAYS THE SOURCE OF TRUTH; NO VALUE IS EVER WRITTEN to canon, a
    manifest, a proposal, a ledger row, a log line or a fixture output -- the
    resolver writes only .local/secrets.json (mode 600, gitignored)
  - >-
    ORGANIC SPREAD: the schema, the migrate tool, the step-5 hook and the
    dual-read ship in the cut; a spoke learns them through update-discovery and
    applyCut alone -- no session is told, no hand step
failure_routing: lug:secrets-manifest-migrates-from-env-template-and-spreads-by-cut
counter_metric: secrets_template_fallback_rows_per_spoke_per_window
enforcement: kernel_check
depends_on:
  - wcl-verify-then-launch
consumers:
  - external:operator
runs_on: on_demand
conformance: >-
  conformance/fixtures/secrets-template-migration/secrets-template-migration.conformance.test.js
concern: >-
  a spoke's .env.template secrets convention migrates to the 1Password-backed
  manifest without a break, measured per spoke
instructions_ref: reference/circles/secrets-template-migration.md
duplicate_of: secrets-template-migration
