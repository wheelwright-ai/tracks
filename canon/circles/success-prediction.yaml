kind: circle
name: success-prediction
owner: otto
level: wheel
status: live
schema_version: 1
trigger: >-
  a prediction is registered, superseded or reviewed
  (src/conductor/successPrediction.js; scripts/success-prediction.js on demand);
  the wheel-clock job success_prediction_review grading what is due, the calling
  session as reviewer; every autopilot run's ROI extraction reading the registry
  (roiExtraction.js prediction-missed rule); and every session start, where
  buildSuccessPredictionSection reports counts
inputs:
  - advisor
  - initiative
  - success_prediction_registry
  - turn_markers
  - author_record
outputs:
  - success_prediction_record
  - success_prediction_verdict
  - remediation_lug
  - ledger_row
  - session_start_surface
invariants:
  - >-
    a prediction is registered BEFORE the work and immutable after: the registry
    is append-only with no update path; a change is a superseding row that never
    rewrites the original
  - >-
    superseding is REFUSED once any verdict exists or check_by has passed --
    editing the target to match the result is the failure mode this circle
    exists to prevent -- and a refusal writes nothing
  - >-
    canon DECLARES a prediction so it is machine-readable, but canon is not the
    bar: the registered row carries a digest, verdicts are judged against it,
    and a later canon edit is reported as divergence, not absorbed
  - >-
    a prediction is accepted only when certified FALSIFIABLE by
    canon/circles/falsifiability-gate.yaml's standard -- the verdict really
    moved on a mutated mirror of the observation swept across the metric's
    domain, never on its wording; no finite domain is UNPROVEN and refused, and
    one no observation could SATISFY is refused alongside one none could refute
  - >-
    a trivially-safe prediction is refused with its class named -- already true
    at the baseline, or near-vacuous (90%+ of the domain satisfies it); no
    measured baseline is refused unless first_baseline: true is declared
  - >-
    the review is by a THIRD PARTY or not at all: the registrant and every
    recorded executor session are refused, the reviewer must pass the four-axis
    src/advisor/independence.js check, and the clock grades only as the calling
    session. A refusal writes nothing
  - >-
    the verdict has THREE outcomes -- achieved, missed, unevaluable -- and
    unevaluable is never scored as either: the achieved rate's denominator is
    achieved+missed only
  - >-
    no reader substitutes a zero for an absent measurement: a reading is a real
    number, or value null with a reason; a reader that throws is reported, never
    swallowed
  - >-
    a MISSED prediction triggers a real deeper review -- the gap, whether the
    metric moved at all from its baseline, prior misses -- and opens ONE
    remediation lug through the kernel verb, on the same cause key the ROI
    extractor's branch dedupes on
  - >-
    NO LUG IS EVER FILED TO REPORT A VERDICT: N verdicts become ONE
    operator-channel section with counts, silent when nothing is owed; only a
    real owed remediation becomes a lug
  - >-
    every cause key names a CAUSE (subject kind, subject, metric), never a
    per-event coordinate -- no session id, run id, date or timestamp -- so N
    occurrences collapse to one finding; at most one lug per sweep, the rest
    REPORTED
  - >-
    a subject whose prediction is unevaluable three times running is surfaced as
    a finding against its own DEFINITION -- an unmeasurable counter_metric is a
    defect, not a neutral outcome
failure_routing: lug:initiatives-and-advisors-carry-a-falsifiable-success-prediction
counter_metric: predictions_registered_without_a_third_party_verdict
enforcement: kernel_check
depends_on:
  - falsifiability-gate
  - lug-kernel-verb
consumers:
  - run-roi-extraction
  - external:operator
  - external:otto
interface_version: v1
runs_on: on_demand
conformance: conformance/fixtures/success-prediction/success-prediction.conformance.test.js
concern: pre-registered-falsifiable-success-claims
instructions_ref: reference/circles/success-prediction.md
duplicate_of: success-prediction
