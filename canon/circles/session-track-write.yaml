kind: circle
name: session-track-write
owner: ozi
level: spoke
status: live
schema_version: 1
trigger: a turn ends (Stop event)
inputs:
  - ledger_rows
  - turn_markers
  - lug_transition_events
  - session_triple
outputs:
  - track_artifact
invariants:
  - one track file per session, all six required sections always present
  - >-
    idempotent -- safe to call on every Stop, never duplicates or loses prior
    content
failure_routing: lug:session-track-write-failure
counter_metric: track_required_sections_present_rate
enforcement: hook
depends_on: []
consumers:
  - external:session-end-handoff
runs_on: hook_event
hook_event_name: Stop
hook_matcher: ''
hook_script: src/hooks/trackWriteHook.js
conformance: >-
  conformance/fixtures/session-track-write/session-track-write.conformance.test.js
concern: session-track-maintenance
instructions_ref: reference/circles/session-track-write.md
duplicate_of: session-track-write
