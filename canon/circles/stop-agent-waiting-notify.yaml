kind: circle
name: stop-agent-waiting-notify
owner: basher
level: spoke
status: live
schema_version: 1
trigger: a real turn completes -- Claude stopped and is waiting
inputs:
  - session_registry
outputs:
  - desktop_toast_notification
invariants:
  - >-
    best-effort only -- a failed or unavailable toast transport never blocks a
    real turn from closing
  - headless sub-sessions never notify
  - >-
    per-spoke posture (autonomy_table_defaults.agent_waiting_notify), default on
    for an interactive session
failure_routing: lug:agent-waiting-notify-failure
counter_metric: agent_waiting_notify_delivery_rate
enforcement: hook
depends_on: []
consumers:
  - 'external:operator (the real v1 cue: a turn completing and waiting on you)'
runs_on: hook_event
hook_event_name: Stop
hook_matcher: ''
hook_script: src/hooks/stopNotifyHook.js
conformance: >-
  conformance/fixtures/circle-agent-waiting-notify/agent-waiting-notify.conformance.test.js
concern: operator-notification-turn-waiting
instructions_ref: reference/circles/stop-agent-waiting-notify.md
duplicate_of: stop-agent-waiting-notify
