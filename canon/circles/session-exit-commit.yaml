kind: circle
name: session-exit-commit
owner: basher
level: spoke
status: live
schema_version: 1
trigger: >-
  a real session ends (SessionEnd event), after the handoff is written and the
  track closed
inputs:
  - closed_track_artifact
  - session_files_touched_record
  - session_transcript
  - session_registry_row
  - last_test_run_record
  - spoke_profile_posture
outputs:
  - commit
  - push_result
  - ledger_row
  - exit_verdict
invariants:
  - >-
    the staged set is only this session's own files (its files-touched record
    unioned with its transcript's tool_use blocks) plus the hook-written harness
    state, by pathspec -- never `git add -A`; a file a live peer lane also
    touched is contended and left with a row naming both ids; a file this
    session never touched is left and named for its lane, or as unattributed; a
    commit that cannot attribute stays scoped, never widens (lug
    session-exit-commit-sweeps-a-peer-lanes-in-flight-files, 260914)
  - >-
    no commit ever contains credential material: rule 13's credential patterns
    run over the staged set first, and a finding blocks the commit and unstages
  - >-
    a red aggregator never reaches the mainline: the work lands on a wip/*
    branch, unpushed, with a ledger row and a stderr line that both name the
    branch and the verb that consumes it (`hf deploy --stage fold`)
  - >-
    never --force and never --no-verify: a rejected push and a refusing hook are
    both reported, never overridden
  - >-
    the commit message is generated from the session's real track --
    coordinates, lug transitions, prompt ids -- never typed
  - >-
    a push that fails leaves the commit local and is announced at the next
    wakeup's what-changed
  - >-
    a refused commit is surfaced, never silent: the hook prints the refusal
    verdict to stderr and exits non-zero so Claude Code shows it, and the ledger
    row carries the verdict line intact -- never the first 500 characters of
    gate chatter
  - >-
    the hook's timeout is derived from measurement (hook_timeout_seconds: 60 =
    Claude Code's observed cancel window, three real /exit's on 2026-09-14
    cancelled at ~60s whatever was declared), never a round default
  - >-
    every run prints exactly one verdict line on stderr, last
    (`session-exit-commit: <repo>: committed N file(s) as <sha8>, push deferred
    (<why>) | clean | REFUSED -- <cause> | push failed -- <cause> | wip <branch>
    <sha8> (tree was red)`) and writes the same verdict to
    runtime/exit-verdict.json {session_id, repo, verdict, detail, at, wall_ms},
    the file wcl's closed: line reads, never the ledger tail (lug
    exit-prints-one-verdict-line, 260916)
  - >-
    SessionEnd never runs the full suite: the commit gate gets a fixed 12s
    budget (EXIT_GATE_BUDGET_MS) and DEFERS the suites it cannot reach to the
    push gate by name; the push is never attempted at exit (a deferral row,
    announced next wakeup); a repo reached after the 45s wall cap is DEFERRED
    with a row, never started -- the hook always returns inside Claude Code's
    window with every row written
failure_routing: lug:session-exit-commit-failure
counter_metric: session_exit_pushed_rate
enforcement: hook
depends_on:
  - session-files-touched
  - external:session-end-handoff
  - external:session-track-write
  - external:session-registry
consumers:
  - external:warmup-goals-review
  - wcl-verify-then-launch
runs_on: hook_event
hook_event_name: SessionEnd
hook_matcher: ''
hook_script: src/hooks/sessionExitCommitHook.js
hook_timeout_seconds: 60
conformance: >-
  conformance/fixtures/session-exit-commit/session-exit-commit.conformance.test.js
concern: session-exit-commit-and-push
instructions_ref: reference/circles/session-exit-commit.md
duplicate_of: session-exit-commit
