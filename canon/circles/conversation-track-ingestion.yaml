kind: circle
name: conversation-track-ingestion
owner: otto
level: spoke
status: live
schema_version: 1
trigger: >-
  an operator or agent runs `node scripts/ingest-conversations.js` at an
  instance root, to mine conversation/track exports from any declared source for
  operator goals and preferences and for stranded ideas.
inputs:
  - conversation_source
  - track_artifact
  - lug_corpus
  - tastegraph
outputs:
  - tastegraph_proposal_row
  - lug
  - ingestion_report
invariants:
  - >-
    adding a source is a new adapter, never a rewrite: extractors.js reads only
    the normalized record shapes declared in scripts/ingest/sourceAdapter.js,
    never a source's native format, and never branches on conversation.source
  - >-
    every segment carries an openable citation -- a repo-relative file plus a
    pointer into it -- and assertConversationShape rejects an adapter that omits
    one
  - >-
    every segment declares text_is_verbatim, and assertFindingQuotesAreVerbatim
    refuses any finding that presents a synthesized span as a quotation
  - >-
    dry run is the default; --apply only PROPOSES a taste (a real ledger row
    with turn provenance, resolvable by the operator either way), and
    --accept-tastes is the separate deliberate step that upserts
    tastegraph/overlay.yaml
  - >-
    a machine-derived taste key never overwrites an operator-stated one -- a key
    already present in master.yaml or overlay.yaml with a different value is
    refused before a proposal row is even written
  - >-
    no second profile store is built: goals go to tastegraph through
    src/tastegraph/propose.js, stranded ideas become lug files at `captured`
    promoted through the kernel verb, and a verb refusal is reported verbatim
    rather than worked around
  - >-
    a reason for not proceeding is quoted only when the source really states
    one; otherwise the finding records "reason not recoverable from the source"
    and never guesses
  - >-
    recurrence is measured in distinct DAYS, not distinct sessions -- one
    dispatched prompt fans out to several sessions within minutes, and session
    count measures fan-out rather than restatement
  - >-
    a thin result is reported as thin: every filter's count is printed, so a
    zero-finding run says why it is zero instead of being silently empty
failure_routing: lug:conversation-track-ingestion-tool-for-goals-and-stranded-ideas
counter_metric: ingestion_findings_false_positive_rate
enforcement: kernel_check
depends_on:
  - lug-kernel-verb
  - tastegraph-propose
consumers:
  - external:operator
  - external:otto
runs_on: on_demand
conformance: >-
  conformance/fixtures/conversation-track-ingestion/conversation-track-ingestion.test.js
concern: conversation-source-ingestion-for-goals-and-stranded-ideas
instructions_ref: canon/circles/conversation-track-ingestion.md
duplicate_of: conversation-track-ingestion
hosted_by: instance
