kind: circle
name: ready-gate-stub
owner: ozi
level: spoke
status: live
schema_version: 1
trigger: a lug's state field is edited to ready
inputs:
  - lug
outputs:
  - ledger_row
invariants:
  - never mutates the lug it checks
  - >-
    never allows readiness: passed -- only readiness: stubbed can enter ready
    until increment 7
  - every stubbed entry into ready writes a ledger row; it never passes silently
failure_routing: lug:ready-gate-stub-failure
counter_metric: ready_stub_entry_rate
enforcement: hook
depends_on: []
consumers:
  - external:conductor
  - external:wilbur
runs_on: hook_event
hook_event_name: PreToolUse
hook_matcher: Edit|Write
hook_script: src/hooks/readyGateStubHook.js
conformance: >-
  conformance/fixtures/circle-ready-gate-stub/ready-gate-stub.conformance.test.js
concern: lug-readiness-stub
instructions_ref: reference/circles/ready-gate-stub.md
duplicate_of: ready-gate-stub
