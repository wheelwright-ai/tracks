kind: circle
name: bash-destructive-command-guard
owner: ozi
level: spoke
status: live
schema_version: 1
trigger: a Bash command is about to run
inputs:
  - bash_command
outputs:
  - deny_decision
invariants:
  - heuristic, not a parser -- documented as such, not claimed as complete
  - >-
    operates per logical line, same disclosed residual gap as bash-lug-guard for
    ;/&&/||/| within one line
  - >-
    never touches a path under a real scratch/temp convention (os.tmpdir(), a
    scratchpad dir, a bare tmp/temp/scratch relative dir)
failure_routing: lug:bash-destructive-command-guard-widening-gaps
counter_metric: bash_destructive_command_block_rate
enforcement: hook
depends_on: []
consumers:
  - >-
    external:operator (real, unrecoverable data loss avoided is the whole
    product; no downstream circle consumes this circle's deny decision)
runs_on: hook_event
hook_event_name: PreToolUse
hook_matcher: Bash
hook_script: src/hooks/bashDestructiveGuardHook.js
conformance: >-
  conformance/fixtures/circle-bash-destructive-guard/bash-destructive-guard.conformance.test.js
concern: destructive-bash-command-prevention-proactive
instructions_ref: reference/circles/bash-destructive-command-guard.md
duplicate_of: bash-destructive-command-guard
